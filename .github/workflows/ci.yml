name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The root tests and typecheck reach into website/src, which imports
      # CodeMirror, so the website's dependencies must be present here too.
      - run: pnpm --dir website install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm --dir website audit
      - run: pnpm check

  website:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      # The website imports the engine from src, which depends on dayjs, so
      # the root dependencies must be present alongside the website's own.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir website install --frozen-lockfile
      - run: pnpm --dir website check
      - run: pnpm --dir website test:dev
      - run: pnpm --dir website build
      - name: Deploy website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: website
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
